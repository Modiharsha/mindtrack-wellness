services:
  - type: web
    name: mindtrack-wellness
    env: node
    plan: free
    buildCommand: npm install && cd server && npx prisma generate && npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts && cd .. && npm run build:all
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
